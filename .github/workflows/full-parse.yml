name: Full WSDC parse pipeline

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Run source label for parse_runs"
        required: false
        default: github-actions
        type: choice
        options:
          - github-actions
          - local
      export_only:
        description: "Skip load step; re-export CSV from Supabase only"
        required: false
        default: false
        type: boolean
      data_dir:
        description: "Path to parser CSV directory (required if export_only=false)"
        required: false
        default: data
        type: string
      parse_full:
        description: "Run HTTP cloud parser for ALL dancer IDs 1..live_max (replace CSVs)"
        required: false
        default: false
        type: boolean
      parse_new_only:
        description: "Legacy: parse only new IDs above watermark (merge CSVs)"
        required: false
        default: false
        type: boolean
      notify_parse_start:
        description: "Send #WSDC_Pipeline_Parse_Start Telegram (probe job sends it when auto-triggered)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: wsdc-full-parse
  cancel-in-progress: false

jobs:
  parse:
    if: ${{ !inputs.export_only && (inputs.parse_full || inputs.parse_new_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Notify Telegram (parse starting)
        if: ${{ inputs.parse_full && inputs.notify_parse_start }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py parse-start-live

      - name: Run HTTP cloud parser (full database)
        if: ${{ inputs.parse_full }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python scripts/cloud_parse.py --full --base-dir data

      - name: Run HTTP cloud parser (new IDs only, legacy)
        if: ${{ inputs.parse_new_only && !inputs.parse_full }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python scripts/cloud_parse.py --new-only --base-dir data

      - name: Upload parser CSVs
        uses: actions/upload-artifact@v4
        with:
          name: parser-csvs
          path: |
            data/dancers_points_info.csv
            data/dancer_role_info.csv
            data/dancers_results_info.csv
            data/location_info.csv
            data/events_wsdc.csv
          if-no-files-found: error
          retention-days: 30

      - name: Notify Telegram (parse failed)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py pipeline-failed

  pipeline:
    needs: parse
    if: ${{ !cancelled() && (needs.parse.result == 'success' || needs.parse.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download parser CSVs
        if: ${{ needs.parse.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: parser-csvs
          path: data

      - name: Verify CSV inputs exist
        if: ${{ !inputs.export_only }}
        run: |
          if [ ! -f "${{ inputs.data_dir }}/dancers_points_info.csv" ]; then
            echo "Missing CSVs in ${{ inputs.data_dir }}/ — run with parse_full=true or Re-run failed jobs after a successful parse job"
            exit 1
          fi

      - name: Run pipeline (migrations -> preprocess -> load -> export)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          args=(python scripts/run_pipeline.py --source "${{ inputs.source }}")
          if [ "${{ inputs.export_only }}" = "true" ]; then
            args+=(--export-only)
          else
            args+=(--data-dir "${{ inputs.data_dir }}")
          fi
          "${args[@]}"

      - name: Gate exported CSV vs Supabase
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python scripts/validate_export_vs_db.py --data-dir data

      - name: Commit exported CSV files
        id: commit_csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/event_aliases.json data/quality_reports/
          if git diff --staged --quiet; then
            echo "No CSV changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update WSDC CSV export [skip ci]"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger bot CSV sync
        if: success() && steps.commit_csv.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WSDC_BOT_SYNC_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::WSDC_BOT_SYNC_TOKEN not set — skipping bot CSV sync trigger"
            exit 0
          fi
          gh api repos/zlat1109/wsdc-telegram-bot/dispatches \
            -f event_type=pipeline-csv-updated \
            -f client_payload[ref]=main \
            -f client_payload[source]=${{ github.repository }}

      - name: Sync homepage KPIs + Point Summary to analytics site
        if: success()
        env:
          WSDC_ANALYTICS_DEPLOY_TOKEN: ${{ secrets.WSDC_ANALYTICS_DEPLOY_TOKEN }}
          POINT_SUMMARY_CUTOFF: "2026-07-28"
          POINT_SUMMARY_REPORT: data/quality_reports/point_summary_last.json
          CHAMPION_NEWS_CUTOFF: "2026-07-25"
          CHAMPION_NEWS_REPORT: data/quality_reports/champion_news_last.json
        run: bash scripts/sync_analytics_site.sh

      - name: Point Summary status
        if: always() && hashFiles('data/quality_reports/point_summary_last.json') != ''
        id: point_summary
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/quality_reports/point_summary_last.json")
          if not p.exists():
              print("No Point Summary report")
              raise SystemExit(0)
          r = json.loads(p.read_text())
          print(f"created={r.get('created_count', 0)} updated={r.get('updated_count', 0)}")
          if r.get("dry_run"):
              print("dry_run report only")
          PY

      - name: Champion News status
        if: always() && hashFiles('data/quality_reports/champion_news_last.json') != ''
        id: champion_news
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/quality_reports/champion_news_last.json")
          if not p.exists():
              print("No Champion News report")
              raise SystemExit(0)
          r = json.loads(p.read_text())
          print(f"created={r.get('created_count', 0)} updated={r.get('updated_count', 0)}")
          PY

      - name: Notify Telegram (pipeline complete)
        if: success() && inputs.export_only != true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIPELINE_CSV_COMMITTED: ${{ steps.commit_csv.outputs.committed }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POINT_SUMMARY_REPORT: data/quality_reports/point_summary_last.json
          CHAMPION_NEWS_REPORT: data/quality_reports/champion_news_last.json
        run: python scripts/telegram_notify.py pipeline-complete

      - name: Notify Telegram (pipeline failed)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py pipeline-failed
