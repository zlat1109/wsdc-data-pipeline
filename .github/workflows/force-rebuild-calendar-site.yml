# After manual Supabase location/DB repairs: export CSVs → rebuild calendar/site → push Pages.
# Does not run cloud parse or load.
name: Force rebuild calendar/site

on:
  workflow_dispatch:
    inputs:
      commit_csv:
        description: "Commit exported data/*.csv to main"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wsdc-publish
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Supabase → CSV
        id: export
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python scripts/run_pipeline.py --export-only --source github-actions

      - name: Notify Telegram (quality gate / export failed)
        if: (failure() || cancelled()) && steps.export.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_TELEGRAM: "1"
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py quality-gate-failed

      - name: Commit exported CSV files
        id: commit_csv
        if: ${{ success() && inputs.commit_csv }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/commit_data_via_pr.sh \
            "chore(data): force-rebuild export [skip ci]" \
            data/*.csv data/event_aliases.json data/quality_reports/

      - name: Sync analytics site (calendar + L2 + cache stamp)
        if: success()
        env:
          WSDC_ANALYTICS_DEPLOY_TOKEN: ${{ secrets.WSDC_ANALYTICS_DEPLOY_TOKEN }}
          REQUIRE_DEPLOY_TOKEN: "1"
          REQUIRE_YEAR_CALENDAR: "1"
          POINT_SUMMARY_CUTOFF: "2026-07-28"
          POINT_SUMMARY_REPORT: data/quality_reports/point_summary_last.json
          CHAMPION_NEWS_CUTOFF: "2026-07-25"
          CHAMPION_NEWS_REPORT: data/quality_reports/champion_news_last.json
          YEAR_CAL_REPORT: data/quality_reports/year_event_calendar_last.json
        run: bash scripts/sync_analytics_site.sh

      - name: Notify Telegram (force-rebuild complete)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_TELEGRAM: "1"
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_CSV_COMMITTED: ${{ steps.commit_csv.outputs.committed }}
        run: python scripts/telegram_notify.py force-rebuild-complete

      - name: Notify Telegram (force-rebuild failed)
        if: (failure() || cancelled()) && steps.export.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_TELEGRAM: "1"
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py pipeline-failed
