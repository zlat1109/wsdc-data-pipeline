name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "db/migrations/**"
      - "db/quality_checks.py"
      - "export.py"
      - "scripts/generate_schema_docs.py"
      - "scripts/sync_docs.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync auto-maintained docs
        run: python scripts/sync_docs.py

      - name: Commit doc sync (if changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/commit_data_to_main.sh \
            "docs: auto-sync generated fragments [skip ci]" \
            docs/database/_generated docs/database/migrations.md docs/database/export-views.md docs/operations/quality-monitoring.md

      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
