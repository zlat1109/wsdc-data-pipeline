name: Sync WSDC Events List

on:
  schedule:
    # Every Tuesday 08:00 UTC (~10:00 Europe/Madrid)
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: wsdc-publish
  cancel-in-progress: false

jobs:
  sync-events-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply DB migrations
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python db/apply.py

      - name: Sync events list (scrape + diff + Supabase)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_TELEGRAM: "1"
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/sync_events_list.py --source github-actions

      - name: Export CSV from Supabase (weekly list sync)
        id: export
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_pipeline.py --export-only --skip-migrations --source github-actions

      - name: Notify Telegram (quality gate / export failed)
        if: (failure() || cancelled()) && steps.export.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_TELEGRAM: "1"
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py quality-gate-failed

      - name: Commit weekly events sync data
        id: commit_data
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/commit_data_to_main.sh \
            "chore(data): weekly events list/calendar sync + export [skip ci]" \
            data/events_list/ data/events_calendar/ data/*.csv data/event_aliases.json data/quality_reports/

      - name: Sync analytics site after weekly events sync
        if: success()
        env:
          WSDC_ANALYTICS_DEPLOY_TOKEN: ${{ secrets.WSDC_ANALYTICS_DEPLOY_TOKEN }}
          REQUIRE_DEPLOY_TOKEN: "1"
          REQUIRE_YEAR_CALENDAR: "1"
          POINT_SUMMARY_CUTOFF: "2026-07-28"
          POINT_SUMMARY_REPORT: data/quality_reports/point_summary_last.json
          CHAMPION_NEWS_CUTOFF: "2026-07-25"
          CHAMPION_NEWS_REPORT: data/quality_reports/champion_news_last.json
          YEAR_CAL_REPORT: data/quality_reports/year_event_calendar_last.json
        run: bash scripts/sync_analytics_site.sh

      - name: Notify Telegram (weekly sync failed)
        if: (failure() || cancelled()) && steps.export.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_TELEGRAM: "1"
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py pipeline-failed
