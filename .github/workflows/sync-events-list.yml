name: Sync WSDC Events List

on:
  schedule:
    # Every Tuesday 08:00 UTC (~10:00 Europe/Madrid)
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wsdc-sync-events-list
  cancel-in-progress: false

jobs:
  sync-events-list:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply DB migrations
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python db/apply.py

      - name: Sync events list (scrape + diff + Supabase)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/sync_events_list.py --source github-actions

      - name: Export CSV from Supabase (weekly list sync)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python export.py --output-dir data

      - name: Commit weekly events sync data
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::warning::Skipping data commit (ref=${GITHUB_REF_NAME}; only main publishes data)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/events_list/ data/events_calendar/ data/*.csv data/event_aliases.json data/quality_reports/
          if git diff --staged --quiet; then
            echo "No weekly events-sync changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): weekly events list/calendar sync + export [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync analytics site after weekly events sync
        if: success() && steps.commit_data.outputs.committed == 'true'
        env:
          WSDC_ANALYTICS_DEPLOY_TOKEN: ${{ secrets.WSDC_ANALYTICS_DEPLOY_TOKEN }}
          POINT_SUMMARY_CUTOFF: "2026-07-28"
          POINT_SUMMARY_REPORT: data/quality_reports/point_summary_last.json
          CHAMPION_NEWS_CUTOFF: "2026-07-25"
          CHAMPION_NEWS_REPORT: data/quality_reports/champion_news_last.json
          YEAR_CAL_REPORT: data/quality_reports/year_event_calendar_last.json
        run: bash scripts/sync_analytics_site.sh

      - name: Notify Telegram (weekly sync failed)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/telegram_notify.py pipeline-failed
