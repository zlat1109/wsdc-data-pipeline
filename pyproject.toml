[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsdc-data-pipeline"
version = "0.1.0"
description = "WSDC points parse → Supabase → CSV export → analytics site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.25.0",
  "urllib3>=1.26.0",
  "beautifulsoup4>=4.9.0",
  "selenium>=4.0.0",
  "playwright>=1.40.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "python-dateutil>=2.8.0",
  "us>=3.0.0",
  "googlemaps>=4.10.0",
  "geopy>=2.2.0",
  "matplotlib>=3.3.0",
  "seaborn>=0.11.0",
  "plotly>=5.0.0",
  "folium>=0.14.0",
  "psycopg[binary]>=3.1.0",
  "python-dotenv>=1.0.0",
  "openpyxl>=3.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["db*", "parser*", "transform*", "export*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
